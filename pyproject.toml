[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stadionheft-svw"
version = "0.1.0"
description = "Halbautomatische Erstellung des Stadionhefts 'Wörnitzstein am Ball' des SV Wörnitzstein-Berg"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "Jinja2>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "WeasyPrint>=62,<70",
    "pypdf>=4.2,<8.0",
    "python-dateutil>=2.9,<3.0",
]

[project.scripts]
stadionheft = "stadionheft.cli:main"
# Der Kickbase-Berater ist eine eigenstaendige Anwendung im selben
# Repository. Er teilt sich mit dem Stadionheft nur Flask, Jinja2, PyYAML und
# requests; im eigenen Container wird er ueber requirements-kickbase.txt
# ohne WeasyPrint und pypdf installiert.
kickbase = "kickbase.cli:main"

[tool.setuptools.packages.find]
include = ["stadionheft*", "kickbase*"]

[tool.setuptools.package-data]
stadionheft = ["templates/*.j2", "static/css/*.css", "static/img/*", "web/templates/*.html"]
kickbase = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
