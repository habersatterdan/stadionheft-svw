<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}Stadionheft{% endblock %} – {{ konfiguration.hefttitel }}</title>
  <style>
    :root { --rot: #E52421; --dunkel: #1A1A1A; --grau: #666; --rahmen: #DDD;
            --hell: #F7F7F7; --gruen: #17803D; --gelb: #9A6700; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
           color: var(--dunkel); background: #FAFAFA; line-height: 1.5; }
    header { background: var(--rot); color: #FFF; padding: 1rem 1.5rem; }
    header a { color: #FFF; text-decoration: none; }
    header .titel { font-size: 1.3rem; font-weight: 700; }
    header .unter { font-size: .85rem; opacity: .9; }
    main { max-width: 860px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .3rem; }
    h2 { font-size: 1.05rem; margin: 1.8rem 0 .6rem; }
    .karte { background: #FFF; border: 1px solid var(--rahmen); border-radius: 8px;
             padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
    fieldset { border: none; padding: 0; margin: 0 0 1.2rem; }
    legend { font-weight: 700; font-size: 1rem; padding: 0 0 .5rem; }
    label.zeile { display: flex; gap: .7rem; align-items: flex-start;
                  padding: .6rem .7rem; border: 1px solid var(--rahmen);
                  border-radius: 6px; margin-bottom: .5rem; cursor: pointer;
                  background: #FFF; }
    label.zeile:hover { border-color: var(--rot); }
    label.zeile input { margin-top: .25rem; width: 1.1rem; height: 1.1rem; }
    label.zeile .name { font-weight: 600; }
    label.zeile .liga { color: var(--grau); font-size: .85rem; }
    .feld { margin-bottom: 1rem; }
    .feld label { display: block; font-weight: 600; margin-bottom: .25rem; }
    .feld input[type=text], .feld select {
        width: 100%; padding: .55rem .7rem; border: 1px solid var(--rahmen);
        border-radius: 6px; font-size: 1rem; font-family: inherit; }
    .feld .hilfe { color: var(--grau); font-size: .85rem; margin-top: .25rem; }
    button { background: var(--rot); color: #FFF; border: none; border-radius: 6px;
             padding: .85rem 1.6rem; font-size: 1.05rem; font-weight: 700;
             cursor: pointer; font-family: inherit; }
    button:hover { filter: brightness(.92); }
    .knopf-zweit { display: inline-block; background: #FFF; color: var(--dunkel);
                   border: 1px solid var(--rahmen); border-radius: 6px;
                   padding: .8rem 1.4rem; text-decoration: none; font-weight: 600; }
    .hinweis { border-left: 4px solid var(--gelb); background: #FFFBEB;
               padding: .7rem 1rem; margin: .6rem 0; border-radius: 0 6px 6px 0;
               font-size: .92rem; }
    .fehlerkasten { border-left: 4px solid var(--rot); background: #FEF2F2;
                    padding: 1rem 1.2rem; border-radius: 0 6px 6px 0; }
    .erfolg { border-left: 4px solid var(--gruen); background: #F0FDF4;
              padding: 1rem 1.2rem; border-radius: 0 6px 6px 0; }
    .status { display: inline-block; padding: .15rem .55rem; border-radius: 99px;
              font-size: .78rem; font-weight: 700; }
    .status.ok { background: #DCFCE7; color: var(--gruen); }
    .status.aus { background: #EEE; color: var(--grau); }
    .status.warn { background: #FEF3C7; color: var(--gelb); }
    pre.protokoll { background: #1A1A1A; color: #E6E6E6; padding: 1rem;
                    border-radius: 6px; font-size: .8rem; max-height: 320px;
                    overflow: auto; white-space: pre-wrap; word-break: break-word; }
    details summary { cursor: pointer; color: var(--grau); font-size: .9rem; }
    footer { text-align: center; color: var(--grau); font-size: .82rem;
             padding: 2rem 1rem 3rem; }
    table.info { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.info td { padding: .35rem .5rem; border-bottom: 1px solid var(--rahmen); }
    table.info td:first-child { color: var(--grau); width: 40%; }
    .spinner { display: inline-block; width: 1.1rem; height: 1.1rem;
               border: 3px solid #DDD; border-top-color: var(--rot);
               border-radius: 50%; animation: dreh .8s linear infinite;
               vertical-align: -.2rem; }
    @keyframes dreh { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="titel"><a href="{{ url_for('start') }}">{{ konfiguration.hefttitel }}</a></div>
    <div class="unter">{{ konfiguration.vereinsname }} &middot; Saison {{ konfiguration.saison }}</div>
  </header>
  <main>
    {% block inhalt %}{% endblock %}
  </main>
  <footer>
    <a href="{{ url_for('hilfe') }}">Hilfe</a> &middot;
    Stadionheft-Generator
  </footer>
</body>
</html>
