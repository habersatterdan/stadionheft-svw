# ---------------------------------------------------------------------------
# Anleitung als Website (MkDocs Material)
#
#   Lokal ansehen:   pip install mkdocs-material && mkdocs serve
#   Veroeffentlichen: geschieht automatisch bei jedem Push nach main
#                     (siehe .github/workflows/doku.yml)
# ---------------------------------------------------------------------------

site_name: Stadionheft SV Wörnitzstein-Berg
site_description: Anleitung zur Erstellung des Stadionhefts „Wörnitzstein am Ball"
site_author: SV Wörnitzstein-Berg
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Zu dunkler Ansicht wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Zu heller Ansicht wechseln
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Start: index.md
  - Für alle:
      - Heft erstellen: heft-erstellen.md
      - Wenn etwas nicht klappt: fehler.md
  - Für die Redaktion:
      - Inhalte pflegen: inhalte-pflegen.md
      - Werbung verwalten: werbung.md
  - Für Administratoren:
      - Erste Einrichtung (Schritt für Schritt): ERSTE_EINRICHTUNG.md
      - Installation auf der NAS: INSTALLATION_NAS.md
      - Ordner auf der NAS: NAS_ORDNERSTRUKTUR.md
      - Zugriff von unterwegs: VPN_EINRICHTEN.md
      - FuPa-Anbindung: fupa.md
  - Hintergrund:
      - Umsetzungskonzept: KONZEPT.md
      - Analyse der Vorlage: ANALYSE_VORLAGE.md

markdown_extensions:
  - admonition
  - attr_list
  # md_in_html wird fuer die Kachel-Uebersicht auf der Startseite gebraucht
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: de

extra_css:
  - stylesheets/svw.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.sv-woernitzstein-berg.de/
      name: Vereinswebsite

copyright: SV Wörnitzstein-Berg e.V.
