# ---------------------------------------------------------------------------
# Stadionheft-Generator auf der SVWNAS (DS720+)
#
# Es wird nichts mehr selbst gebaut: Das fertige Image kommt von GitHub.
# Verwendung im Container Manager:
#     Projekt -> Erstellen -> Ordner mit dieser Datei waehlen
#
# Aktualisieren (Container Manager -> Projekt -> Aktion):
#     Zuerst "Erstellen" mit angehaktem "Images neu aufbauen" oder auf der
#     Kommandozeile:  docker compose pull && docker compose up -d
#
# Vollstaendige Anleitung: docs/ERSTE_EINRICHTUNG.md
#
# WICHTIG: Die Pfade unten muessen zur tatsaechlichen Ablage passen. Liegt
# _Programm z. B. unter .../Stadionheft/app/_Programm, dann hier ueberall
# "/Stadionheft/_Programm" durch "/Stadionheft/app/_Programm" ersetzen.
# ---------------------------------------------------------------------------
services:
  stadionheft:
    image: ghcr.io/habersatterdan/stadionheft-svw:latest

    # ACHTUNG: "image:" und "build:" duerfen NIE beide aktiv sein.
    # Stehen beide da, baut Docker aus dem oertlichen Quellcode und haengt
    # dem Ergebnis den Namen des GitHub-Abbilds an. Es wird dann nie etwas
    # geholt, und der Container laeuft mit altem Code unter einem Namen, der
    # nach dem aktuellen aussieht.
    #
    # Soll ausnahmsweise selbst gebaut werden, die Zeile "image:" oben
    # loeschen und diese hier aktivieren:
    # build: .
    container_name: stadionheft
    restart: unless-stopped

    ports:
      # Falls 8080 auf der NAS schon belegt ist, hier die linke Zahl aendern,
      # z. B. "8095:8080". Die rechte Zahl bleibt immer 8080.
      - "8080:8080"

    environment:
      TZ: Europe/Berlin
      # Nur noetig, wenn in config.yaml zugang.passwortschutz auf true steht.
      # Das Passwort NICHT hier eintragen, sondern im Container Manager unter
      # "Umgebung" setzen -- sonst steht es im Klartext in dieser Datei.
      # STADIONHEFT_PASSWORT: ""

    volumes:
      # --- Konfiguration -------------------------------------------------
      - /volume1/SVW/Stadionheft/_Programm/00_Konfiguration:/app/config

      # --- Vereinswappen und andere Vorlagen (nur lesen) -----------------
      - /volume1/SVW/Stadionheft/_Programm/01_Vorlagen:/app/daten/01_vorlagen:ro

      # --- CSV-Dateien, falls FuPa einmal ausfaellt ----------------------
      - /volume1/SVW/Stadionheft/_Programm/03_Eingaben:/app/daten/03_eingaben

      # --- Arbeitsordner und Protokolle ----------------------------------
      - /volume1/SVW/Stadionheft/_Programm/04_Zwischenergebnisse:/app/daten/04_zwischenergebnisse
      - /volume1/SVW/Stadionheft/_Programm/99_Logs:/app/logs

      # --- Die fertigen Dateien: in den Saisonordner ---------------------
      # Hier holt sich die Person, die das Heft zusammenbaut, die PDFs ab.
      # Beim Saisonwechsel diese Zeile auf den neuen Ordner umstellen.
      - /volume1/SVW/Stadionheft/Saison 26-27/05_Ausgaben:/app/daten/05_ausgaben
